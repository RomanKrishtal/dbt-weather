version: 2

models:
  - name: bronze_dim_cities
    description: Bronze dimension table for cities
    columns:
      - name: city_id
        description: Unique city identifier
        tests:
          - unique
          - not_null
      - name: city_name
        description: Name of the city
        tests:
          - unique
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null

  - name: bronze_dim_dates
    description: Bronze dimension table for dates
    columns:
      - name: date_id
        description: Date in YYYYMMDD format
        tests:
          - unique
          - not_null
      - name: date
        tests:
          - not_null

  - name: bronze_dim_weather_codes
    description: Bronze dimension table for weather codes
    columns:
      - name: weather_code
        description: Weather code number
        tests:
          - unique
          - not_null
      - name: description
        tests:
          - not_null

  - name: bronze_fct_weather
    description: Bronze fact table with weather measurements
    columns:
      - name: weather_id
        description: Unique weather record identifier
        tests:
          - unique
          - not_null
      - name: temperature_celsius
        tests:
          - not_null
      - name: weather_code